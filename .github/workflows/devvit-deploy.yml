name: Devvit Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devvit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: devvit-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify Devvit scaffold
        run: |
          test -s package.json
          test -s devvit.yaml
          test -s src/main.tsx

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: devvit login
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');

          const raw = (process.env.DEVVIT_TOKEN || '').trim();
          if (!raw) {
            console.error('::error::DEVVIT_TOKEN secret is not set');
            process.exit(1);
          }

          let auth;
          try {
            auth = raw.startsWith('{') ? JSON.parse(raw) : { accessToken: raw };
          } catch {
            console.error('::error::DEVVIT_TOKEN must be plain token text or auth.json content');
            process.exit(1);
          }

          if (!auth || typeof auth.accessToken !== 'string' || !auth.accessToken.trim()) {
            console.error('::error::DEVVIT_TOKEN must contain a non-empty accessToken');
            process.exit(1);
          }

          const dir = path.join(os.homedir(), '.devvit');
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'auth.json'), JSON.stringify(auth, null, 2));
          NODE
          npx devvit whoami

      - name: devvit validate
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          test -s devvit.yaml
          test -s src/main.tsx
          npx devvit version

      - name: devvit upload
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          npx devvit upload --copy-paste

      - name: devvit publish
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          TARGET_SUBREDDIT: ${{ secrets.TARGET_SUBREDDIT }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$TARGET_SUBREDDIT" ]; then
            echo "::error::TARGET_SUBREDDIT secret is not set"
            exit 1
          fi
          SUB="${TARGET_SUBREDDIT#r/}"
          npx devvit install "r/$SUB"
