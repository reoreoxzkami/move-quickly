name: Devvit Deploy

# Triggered on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (optional)'
        required: false

concurrency:
  group: devvit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: devvit-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Devvit scaffold
        run: |
          test -f package.json
          test -f devvit.yaml
          test -f src/main.tsx

      - name: Verify required secrets
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          TARGET_SUBREDDIT: ${{ secrets.TARGET_SUBREDDIT }}
        run: |
          # Fail FAST if secrets are missing or empty. We do NOT echo the
          # values — only their lengths — so nothing leaks to the run log.
          missing=0
          if [ -z "${DEVVIT_TOKEN}" ]; then
            echo "::error title=Missing secret::DEVVIT_TOKEN secret is not set on this repository."
            missing=1
          else
            echo "DEVVIT_TOKEN length: ${#DEVVIT_TOKEN}"
          fi
          if [ -z "${TARGET_SUBREDDIT}" ]; then
            echo "::error title=Missing secret::TARGET_SUBREDDIT secret is not set on this repository."
            missing=1
          else
            echo "TARGET_SUBREDDIT length: ${#TARGET_SUBREDDIT}"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set the missing secrets in Devvit Studio → Settings → GitHub repository secrets, then re-run."
            exit 78
          fi

      - name: Install dependencies
        run: npm install

      - name: devvit login
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          # Non-interactive login: Devvit CLI reads DEVVIT_TOKEN from env.
          # The --token flag is NOT supported; presence of the env var is enough.
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          npx -y devvit@latest whoami || true

      - name: devvit bundle
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: npx -y devvit@latest bundle

      - name: devvit upload
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: npx -y devvit@latest upload --copyPaste

      - name: devvit publish
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          TARGET_SUBREDDIT: ${{ secrets.TARGET_SUBREDDIT }}
        run: |
          # Strip any leading "r/" the user may have included in the secret.
          SUB="${TARGET_SUBREDDIT#r/}"
          npx -y devvit@latest install "r/$SUB"
