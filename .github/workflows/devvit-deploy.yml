name: Devvit Deploy

# Triggered on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (optional)'
        required: false

concurrency:
  group: devvit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: devvit-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Devvit scaffold
        run: |
          test -s package.json
          test -s devvit.yaml
          test -s src/main.tsx

      - name: Install dependencies
        run: npm install

      - name: devvit login
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          npx devvit whoami || true

      - name: devvit bundle
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          npx devvit bundle

      - name: devvit upload
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          npx devvit upload --copyPaste

      - name: devvit publish
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          TARGET_SUBREDDIT: ${{ secrets.TARGET_SUBREDDIT }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$TARGET_SUBREDDIT" ]; then
            echo "::error::TARGET_SUBREDDIT secret is not set"
            exit 1
          fi
          # Strip any leading "r/" the user may have included in the secret.
          SUB="${TARGET_SUBREDDIT#r/}"
          npx devvit install "r/$SUB"
